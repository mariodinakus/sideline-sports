name: Courtside IQ site integration checks
on:
  push:
    branches: [main]
    paths:
      - 'courtside-iq/**'
      - '.github/workflows/courtside-site-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run Courtside syntax and integration tests
        working-directory: courtside-iq
        run: npm run check && npm test
