name: MONO BASKET checks
on:
  push:
    branches: [main]
    paths:
      - 'mono-basket/**'
      - '.github/workflows/mono-basket-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Check the standalone engine
        working-directory: mono-basket
        run: npm run check && npm test
