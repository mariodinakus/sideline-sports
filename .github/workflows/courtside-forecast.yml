name: Courtside NBA forecast learning
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'courtside-iq/scripts/update-predictions.js'
      - 'courtside-iq/lib/forecast-engine.js'
      - '.github/workflows/courtside-forecast.yml'
permissions:
  contents: write
concurrency:
  group: courtside-forecast-ledger
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate JavaScript syntax and model tests
        working-directory: courtside-iq
        run: npm run check && npm test
      - name: Record pregame predictions and settle completed games
        run: node courtside-iq/scripts/update-predictions.js
      - name: Publish only changed forecasts
        run: |
          if git diff --quiet -- courtside-iq/data/prediction-ledger.json; then
            echo 'No new results or pregame predictions'
            exit 0
          fi
          git config user.name 'courtside-forecast-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courtside-iq/data/prediction-ledger.json
          git commit -m 'data(courtside): archive pregame forecasts and final outcomes'
          git push
