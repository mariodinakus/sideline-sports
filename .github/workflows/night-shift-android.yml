name: NIGHT SHIFT · Android APK
on:
  push:
    branches: [night-shift-nba]
    paths:
      - 'night-shift-nba/android/**'
      - '.github/workflows/night-shift-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle -p night-shift-nba/android :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NIGHT-SHIFT-NBA-Android-APK
          path: night-shift-nba/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish APK to NIGHT SHIFT web download
        run: |
          mkdir -p night-shift-nba/downloads
          cp night-shift-nba/android/app/build/outputs/apk/debug/app-debug.apk night-shift-nba/downloads/night-shift-nba.apk
          git config user.name "night-shift-build[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f night-shift-nba/downloads/night-shift-nba.apk
          git diff --cached --quiet || (git commit -m "build(nba): publish Android debug APK" && git push origin HEAD:night-shift-nba)
